services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,groq}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APP_RATE_LIMIT_PER_MIN: ${APP_RATE_LIMIT_PER_MIN:-30}
      EMBEDDER: ${EMBEDDER:-minilm}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
